name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Code Validation & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: sahabat_umkm_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: sahabat-umkm-be/package-lock.json

      - name: Install Dependencies
        working-directory: sahabat-umkm-be
        run: npm ci

      - name: Database Migration Check
        working-directory: sahabat-umkm-be
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
          DB_DATABASE: sahabat_umkm_test
          DB_DIALECT: mysql
          JWT_SECRET: ci_secret_key_testing_12345
        run: npx sequelize-cli db:migrate

      - name: Security Vulnerability Scan
        working-directory: sahabat-umkm-be
        run: npm audit --audit-level=high || true

  build-container:
    name: Build & Push Docker Image
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: sahabat-umkm-be
          file: sahabat-umkm-be/docker/Dockerfile
          push: false
          tags: sahabat-umkm-be:latest

